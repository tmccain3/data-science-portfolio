<title>AI Adoption & Business Revenue Change | Teona McCain</title>

<link rel="stylesheet" href="../../assets/css/style.css">

<style>

    .project-page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 32px 100px;
    }

    .project-hero {
        padding: 50px 0 45px;
        max-width: 1000px;
    }

    .project-hero h1 {
        font-size: 3.5rem;
        line-height: 1.08;
        margin: 16px 0 24px;
    }

    .project-intro {
        max-width: 900px;
        font-size: 1.2rem;
        line-height: 1.7;
    }

    .eyebrow,
    .section-number {
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #667085;
    }

    .project-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 28px;
    }

    .project-tags span {
        background: #e5e7eb;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 0.85rem;
    }

    .project-section {
        padding: 45px 0;
        border-top: 1px solid #dfe3e8;
    }

    .section-header {
        margin-bottom: 30px;
    }

    .project-section h2 {
        font-size: 2rem;
        margin: 8px 0 24px;
    }

    .project-section h3 {
        margin-top: 32px;
        margin-bottom: 14px;
    }

    .project-section p,
    .project-section li {
        line-height: 1.75;
    }

    .project-section p {
        max-width: 930px;
        margin-bottom: 20px;
    }

    .research-question {
        background: #ffffff;
        border: 1px solid #dfe3e8;
        border-radius: 14px;
        padding: 28px 32px;
        margin: 25px 0 34px;
        max-width: 930px;
        font-size: 1.2rem;
        font-weight: 600;
        line-height: 1.6;
    }

    .story-card {
        background: #ffffff;
        border: 1px solid #dfe3e8;
        border-left: 4px solid #1f2937;
        border-radius: 14px;
        padding: 30px 34px;
        margin: 30px 0;
        max-width: 930px;
    }

    .story-card p:last-child {
        margin-bottom: 0;
    }

    .content-grid {
        display: grid;
        gap: 20px;
        margin: 30px 0;
    }

    .two-column {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .content-card {
        background: #ffffff;
        border: 1px solid #dfe3e8;
        border-radius: 14px;
        padding: 28px;
    }

    .content-card h3 {
        margin-top: 0;
    }

    .project-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin: 30px 0;
    }

    .project-stats > div {
        background: #ffffff;
        border: 1px solid #dfe3e8;
        border-radius: 14px;
        padding: 24px;
    }

    .project-stats strong {
        display: block;
        font-size: 1.9rem;
        margin-bottom: 5px;
    }

    .project-stats span {
        color: #667085;
        line-height: 1.4;
    }

    .visual-block {
        margin: 40px 0 70px;
    }

    .visual-block h3 {
        font-size: 1.45rem;
        margin-bottom: 20px;
    }

    .project-chart {
        display: block;
        width: 100%;
        height: auto;
        background: #ffffff;
        border: 1px solid #dfe3e8;
        border-radius: 14px;
        padding: 12px;
        box-sizing: border-box;
        margin-bottom: 26px;
    }

    .visual-copy {
        max-width: 930px;
    }

    .callout {
        background: #ffffff;
        border: 1px solid #dfe3e8;
        border-left: 4px solid #1f2937;
        border-radius: 14px;
        padding: 30px 34px;
        margin: 34px 0;
        max-width: 930px;
    }

    .callout-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #667085;
        margin-bottom: 10px;
    }

    .callout p {
        margin: 0;
        font-size: 1.15rem;
    }

    .project-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 28px 0 40px;
    }

    .project-buttons .button {
        display: inline-block;
        padding: 12px 18px;
        border: 1px solid #cbd0d6;
        border-radius: 8px;
        text-decoration: none;
        color: #1f2937;
        background: #ffffff;
        font-weight: 600;
    }

    .project-buttons .button.primary {
        background: #1f2937;
        color: #ffffff;
        border-color: #1f2937;
    }

    .project-buttons .button:hover {
        opacity: 0.9;
    }

    .source-card {
        background: #ffffff;
        border: 1px solid #dfe3e8;
        border-radius: 14px;
        padding: 24px;
        margin-bottom: 16px;
        max-width: 930px;
    }

    .source-card p {
        margin-bottom: 8px;
    }

    .source-card a {
        word-break: break-word;
    }

    body {
        background: #eef1f4;
    }

    nav {
        background: #ffffff;
    }

    .project-page {
        background: #eef1f4;
    }

    @media (max-width: 850px) {

        .project-page {
            padding: 0 20px 70px;
        }

        .project-hero {
            padding: 70px 0 55px;
        }

        .project-hero h1 {
            font-size: 2.5rem;
        }

        .two-column,
        .project-stats {
            grid-template-columns: 1fr;
        }
    }

</style>
